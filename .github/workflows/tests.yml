name: Test suite

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the test suite
        # Sans numpy/torch/modeles : les flux lourds se desactivent seuls,
        # la suite verifie la logique pure, le serveur HTTP et les validations.
        run: python3 -m unittest discover -s tests -v
